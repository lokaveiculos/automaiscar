// ── Theme toggle ─────────────────────────────────────────────
function toggleTheme() {
  var current = document.documentElement.getAttribute('data-theme') || 'light';
  var next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('am_theme', next);
  updateThemeBtn(next);
}
function updateThemeBtn(theme) {
  var icon  = document.getElementById('theme-icon');
  var label = document.getElementById('theme-label');
  if(icon)  icon.setAttribute('data-lucide', theme === 'dark' ? 'moon' : 'sun');
  if(label) label.textContent = theme === 'dark' ? 'Tema Escuro' : 'Aparência';
  if(typeof lucide !== 'undefined') lucide.createIcons();
}
(function(){
  var saved = localStorage.getItem('am_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  // Apply after DOM ready
  document.addEventListener('DOMContentLoaded', function(){ updateThemeBtn(saved); });
})();

  var sb = document.getElementById('sb');
  var ov = document.getElementById('sb-overlay');
  if(!sb) return;

  if(ov) ov.classList.toggle('open');
}
function csb() {
  var sb = document.getElementById('sb');
  var ov = document.getElementById('sb-overlay');
  if(sb) sb.classList.remove('open');
  if(ov) ov.classList.remove('open');
}

// ── Toast (design system) ─────────────────────────────────────
(function(){
  var stack = document.createElement('div');
  stack.className = 'toast-stack';
  document.body.appendChild(stack);
  
  window.toast = function(msg, type, dur) {
    type = type || 'ok';
    dur  = dur  || 3000;
    var icons = {ok:'check',err:'x-circle',warn:'alert-triangle',info:'info'};
    var el = document.createElement('div');
    el.className = 'toast toast-' + type;
    el.innerHTML = '<i data-lucide="' + (icons[type]||'check') + '"></i><span>' + msg + '</span>';
    stack.appendChild(el);
    if(typeof lucide !== 'undefined') lucide.createIcons({nodes:[el]});
    setTimeout(function(){
      el.style.animation = 'toastOut 300ms ease forwards';
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 300);
    }, dur);
  };
})();

// ---------------------------------------------------------------------
// IMPORTAR MANUTENCAO DA OFICINA (19/09/2026)
// Mesmo modelo que ja roda na LOKA: a oficina manda um codigo
// "LOKA-MANUT::<base64 do JSON>" e aqui ele vira manutencao.
// O fluxo e o mesmo (colar -> pre-visualizar -> importar); o visual segue o
// do Auto Mais, para nao destoar do resto do sistema.
// Como a manutencao agora gera despesa, a importada gera tambem.
// ---------------------------------------------------------------------
var _impManut = [];

// A placa vem digitada por gente: comparo so letras e numeros.
function _soPlaca(x){ return String(x||'').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

// "272,00" (brasileiro) ou "642.00" (json) -> numero
function _numeroBR(x){
  var t = String(x==null?'':x).trim();
  if(!t) return 0;
  if(t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  var n = Number(t);
  return isNaN(n) ? 0 : n;
}

// Prefiro o campo custo; sem ele, somo os servicos.
function _valorDoCodigo(d){
  var c = _numeroBR(d.custo);
  if(c > 0) return c;
  return (d.servicos||[]).reduce(function(s,x){ return s + _numeroBR(x.val); }, 0);
}

// Le os codigos colados. Separa sem diferenciar maiuscula (o celular
// autocorrige) e tira todo espaco/quebra de linha, porque o WhatsApp parte o
// base64 no meio.
// Tirar os espacos junta o base64 quebrado pelo WhatsApp -- mas tambem cola
// nele qualquer texto que venha DEPOIS na mensagem ("abraco", "obrigado"),
// porque essas letras tambem sao caracteres validos de base64. Entao vou
// encurtando pela direita ate o conteudo virar um JSON de verdade.
// (O modelo original da LOKA nao faz isso e engasga nesse caso.)
function _decodificar(b64){
  for(var len = b64.length; len >= 8; len--){
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(b64.substring(0, len)))));
      if(d && d.placa) return d;
    } catch(e){ /* tenta um pouco menor */ }
  }
  return null;
}

function _lerCodigos(raw){
  var achados = [], erros = 0;
  String(raw||'').split(/LOKA-MANUT::/i).forEach(function(parte, i){
    if(i === 0) return;   // o que vier antes do primeiro prefixo
    var m = parte.replace(/[\r\n\t ]/g, '').match(/^[A-Za-z0-9+\/=]+/);
    if(!m){ erros++; return; }
    var d = _decodificar(m[0]);
    if(d && d.placa) achados.push(d); else erros++;
  });
  return { achados: achados, erros: erros };
}

// Monta a manutencao no formato do Auto Mais.
// CUIDADO: no codigo da oficina, "tipo" e a natureza (preventiva/corretiva) e
// "descricao" e a lista de servicos. No Auto Mais e o contrario: "tipo" e o
// SERVICO. Por isso os dois trocam de lugar aqui.
function _manutDoCodigo(d, idSugerido){
  var v = (DB.veiculos||[]).find(function(x){ return _soPlaca(x.placa) === _soPlaca(d.placa); });
  var det = [];
  if(d.km)      det.push('KM ' + d.km);
  if(d.tipo)    det.push('Tipo: ' + d.tipo);
  if(d.retorno) det.push('Retorno: ' + d.retorno);
  (d.servicos||[]).forEach(function(x){ det.push(x.desc + ' \u2014 R$ ' + x.val); });
  if(d.obs)     det.push(d.obs);
  return {
    id: idSugerido,
    veiculo_id: v ? v.id : '',
    placa: _soPlaca(d.placa),
    tipo: d.descricao || d.tipo || 'Manuten\u00e7\u00e3o',   // o SERVICO
    status: 'concluida',
    data: d.data || new Date().toISOString().split('T')[0],
    valor: String(_valorDoCodigo(d)),
    oficina: d.oficina || '',
    descricao: det.join(' | '),
    importadoOficina: true
  };
}

// Ja existe manutencao igual? Nao bloqueio (pode haver dois servicos no mesmo
// dia), mas aviso na pre-visualizacao para ninguem importar em duplicidade.
function _jaImportada(m){
  return (DB.manutencoes||[]).some(function(x){
    return _soPlaca(x.placa) === _soPlaca(m.placa) && (x.data||'') === (m.data||'') &&
           Number(x.valor||0) === Number(m.valor||0);
  });
}

function confirmarImportarManut(){
  if(!_impManut.length) return;
  if(!DB.manutencoes) DB.manutencoes = [];
  if(!DB.despesas)    DB.despesas = [];

  // cada manutencao importada leva junto a sua despesa, igual as digitadas
  var pendentes = [], despesas = [], proxDesp = nid(DB.despesas);
  _impManut.forEach(function(m){
    pendentes.push({col:'manutencoes', obj:m});
    if(Number(m.valor||0) > 0){
      var d = _despesaDeManutencao(m);
      d.id = proxDesp++;            // _despesaDeManutencao usa nid(), que repetiria no lote
      despesas.push(d);
      pendentes.push({col:'despesas', obj:d});
    }
  });

  _gravarTudo(pendentes, function(erros){
    if(erros.length){ toast('NAO foi importado por completo -- ' + erros.join(', '), 'err'); return; }
    _impManut.forEach(function(m){ DB.manutencoes.push(m); });
    despesas.forEach(function(d){ DB.despesas.push(d); });
    var n = _impManut.length, nd = despesas.length;
    _impManut = [];
    sDB(); cm(); renderMnt();
    toast(n+' manuten\u00e7\u00e3o(\u00f5es) importada(s)'+(nd?' e '+nd+' despesa(s) lan\u00e7ada(s)':''), 'ok');
  });
}
// ---------------------------------------------------------------------
// MANUTENCAO -> DESPESA (19/09/2026, pedido do Rogel)
// Ate aqui manutencao e despesa eram mundos separados: os R$ 4.920 ja
// lancados em manutencao nao apareciam em lugar nenhum do financeiro.
// Agora toda manutencao COM VALOR gera a despesa correspondente, com
// tipo "Manutencao", e a manutencao e a fonte da verdade: editar atualiza,
// excluir remove, zerar o valor tira a despesa.
//
// ATENCAO ao nome dos campos: na manutencao, "tipo" e o SERVICO
// ("Revisao geral"); na despesa, "tipo" e a CATEGORIA. Sao coisas
// diferentes com o mesmo nome.
// ---------------------------------------------------------------------
// A cadeia Manutencao -> Despesa (DESP_TIPO_MANUT, _gravarTudo,
// _despesaDaManutencao, _despesaDeManutencao) mudou para o
// firebase-shared.js em 12/11/2026: a baixa da previsao de reparo, na aba
// Veiculos, monta a despesa pela MESMA funcao. Duas copias divergiriam.
function svMnt(id){
  var vid = Number(document.getElementById('mv').value);
  var tp  = document.getElementById('mtp').value.trim();
  if(!vid||!tp){toast('Selecione o Veiculo e informe o Servico','err');return;}
  var vv = DB.veiculos.find(function(x){return x.id==vid;});
  var obj = {
    id: id||nid(DB.manutencoes), veiculo_id:vid,
    placa: vv?vv.placa:'', tipo:tp,
    status: document.getElementById('mst').value,
    data:   document.getElementById('mdt').value,
    valor:  document.getElementById('mvl').value,
    oficina:document.getElementById('mof').value,
    descricao:document.getElementById('mds').value
  };

  // A despesa acompanha o VALOR: sem valor nao ha custo a lancar, e se a
  // manutencao tinha valor e foi zerada, a despesa antiga tem de sair.
  var temValor = Number(obj.valor || 0) > 0;
  var jaExiste = _despesaDaManutencao(obj.id);
  var despesa = temValor ? _despesaDeManutencao(obj) : null;

  var pendentes = [{col:'manutencoes', obj:obj}];
  if(despesa)                       pendentes.push({col:'despesas', obj:despesa});
  else if(jaExiste)                 pendentes.push({col:'despesas', id:jaExiste.id, apagar:true});

  _gravarTudo(pendentes, function(erros){
    if(erros.length){
      toast('NAO foi salvo por completo -- ' + erros.join(', '), 'err');
      return;   // a tela continua mostrando o que o banco tem
    }
    if(id) DB.manutencoes = DB.manutencoes.map(function(m){return m.id==id?obj:m;});
    else DB.manutencoes.push(obj);

    if(!DB.despesas) DB.despesas = [];
    if(despesa){
      var i = DB.despesas.findIndex(function(d){ return d.id == despesa.id; });
      if(i >= 0) DB.despesas[i] = despesa; else DB.despesas.push(despesa);
    } else if(jaExiste){
      DB.despesas = DB.despesas.filter(function(d){ return d.id != jaExiste.id; });
    }

    sDB(); cm(); renderMnt();
    var msg = id ? 'Manutencao atualizada' : 'Manutencao registrada';
    if(despesa)       msg += ' \u2014 despesa de R$ ' + brl(despesa.valor) + ' lancada';
    else if(jaExiste) msg += ' \u2014 despesa removida (ficou sem valor)';
    toast(msg, 'ok');
  });
}

function dlMnt(id){
  var d = _despesaDaManutencao(id);
  var aviso = d
    ? 'Excluir esta manutencao?\n\nA despesa de R$ ' + brl(d.valor) + ' lancada por ela tambem sai.'
    : 'Excluir registro?';
  if(!confirm(aviso)) return;

  var pendentes = [{col:'manutencoes', id:id, apagar:true}];
  if(d) pendentes.push({col:'despesas', id:d.id, apagar:true});

  _gravarTudo(pendentes, function(erros){
    if(erros.length){ toast('NAO foi excluido por completo -- ' + erros.join(', '), 'err'); return; }
    DB.manutencoes = DB.manutencoes.filter(function(m){return m.id!=id;});
    if(d) DB.despesas = (DB.despesas||[]).filter(function(x){ return x.id != d.id; });
    sDB(); renderMnt();
    toast(d ? 'Manutencao e despesa excluidas' : 'Manutencao excluida', 'ok');
  });
}

// ── USUARIOS ────────────────────────────────────────────────────
// 🔴 As acoes da linha passam o INDICE do array, nao o id -- e o padrao da
// LOKA (editarUsuario(n)). Motivo medido em 06/11/2026: o usuario "daniel"
// tem id NaN no banco, e `find(u => u.id == NaN)` nunca casa (NaN != NaN),
// entao o botao de editar dele chamava fmUsr(NaN), caia no `if(!u) return`
// e NAO FAZIA NADA, em silencio. Pelo indice, todo registro e alcancavel.
function _usrEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// id utilizavel para gravar/apagar o documento. O do daniel (NaN) nao e.
function _usrIdValido(v){
  if (v === null || v === undefined || v === '') return false;
  if (typeof v === 'number') return isFinite(v);
  var s = String(v).trim();
  return s !== '' && s.toLowerCase() !== 'nan' && s.toLowerCase() !== 'undefined';
}

// ── gravar o usuario ───────────────────────────────────────────
// 🔴 So mexe na tela DEPOIS que o banco confirma (licao do CRM, 15/09/2026):
// avisar "salvo" sem ter salvado e pior do que nao funcionar.
function svUsr(n){
  var novo = (n === null || n === undefined);
  var lista = _usrLista();
  var atual = novo ? null : lista[n];
  if (!novo && !atual) { toast('Usuario nao encontrado','err'); return; }

  var nome  = (document.getElementById('un')||{value:''}).value.trim();
  var login = (document.getElementById('ulog')||{value:''}).value.trim().toLowerCase();
  var email = (document.getElementById('ue')||{value:''}).value.trim();
  var perfil= (document.getElementById('up')||{value:'atendimento'}).value;
  var status= (document.getElementById('ust')||{value:'ativo'}).value;
  var s1 = novo ? (document.getElementById('usenha')||{value:''}).value : '';
  var s2 = novo ? (document.getElementById('usenha2')||{value:''}).value : '';

  if(!nome){ toast('Informe o nome','err'); return; }
  if(!login){ toast('Informe o login','err'); return; }
  if(novo){
    if(!s1){ toast('Informe uma senha','err'); return; }
    if(s1.length < 6){ toast('A senha precisa de no mínimo 6 caracteres','err'); return; }
    if(s1 !== s2){ toast('As senhas não conferem','err'); return; }
  }
  var dup = lista.find(function(u,i){
    return u && String(u.login||'').toLowerCase() === login && i !== n;
  });
  if(dup){ toast('Login "'+login+'" já está em uso','err'); return; }

  // 🔴 Não deixar o sistema sem nenhum administrador ativo. Sem esta trava,
  // rebaixar ou desativar o último admin trancaria todos para fora da
  // Gestão -- e seria preciso mexer no banco para voltar.
  var eraAdminAtivo = !novo && atual.perfil === 'admin' && atual.status !== 'inativo';
  var vaiSerAdminAtivo = (perfil === 'admin' && status !== 'inativo');
  if (eraAdminAtivo && !vaiSerAdminAtivo && _usrAdminsAtivos(n) === 0) {
    toast('Este é o único administrador ativo. Crie ou ative outro antes de mudar este.','err',7000);
    return;
  }

  // id para gravar o documento. O registro com id invalido (NaN) ganha um id
  // novo e o documento velho e removido, senao ficariam dois do mesmo usuario.
  var idAntigo = novo ? null : atual.id;
  var trocouId = !novo && !_usrIdValido(idAntigo);
  var id = (!novo && _usrIdValido(idAntigo)) ? idAntigo : nid(lista);

  var btn = document.getElementById('uBtnSalvar');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  function destrava(){ if (btn) { btn.disabled = false; btn.innerHTML = '&#128190; Salvar'; } }

  function montarSenha(){
    if (!novo) return Promise.resolve({});
    if (!amTemCrypto()) {
      // Sem crypto nao da para gerar hash. Grava como antes e AVISA, em vez
      // de recusar e deixar o usuario sem senha nenhuma.
      toast('Navegador sem suporte a hash — senha gravada sem proteção','err',7000);
      return Promise.resolve({ senha: s1, senhaHash: null, salt: null });
    }
    var salt = amNovoSalt();
    return amHashSenha(s1, salt).then(function(h){
      // senha: null apaga o texto puro do banco
      return { senhaHash: h, salt: salt, senha: null };
    });
  }

  montarSenha().then(function(campos){
    var obj = Object.assign({}, novo ? {} : atual, {
      id: id, nome: nome, login: login, email: email,
      perfil: perfil, status: status
    }, campos);

    fsave('usuarios', obj, function(err){
      if (err) {
        destrava();
        toast('NÃO foi salvo: '+(err && err.code === 'permission-denied'
          ? 'o banco não autoriza gravar em usuarios.' : (err.message||'falha de conexão')),'err',8000);
        return;   // o modal fica aberto, nada do que foi digitado se perde
      }
      if (trocouId) {
        fdel('usuarios', String(idAntigo));   // remove o documento de id inválido
      }
      if (novo) DB.usuarios = lista.concat([obj]);
      else      DB.usuarios = lista.map(function(u,i){ return i === n ? obj : u; });
      sDB(); cm(); renderUsr();
      toast('Usuário '+(novo?'criado':'atualizado')+' com sucesso'+(trocouId?' (id corrigido)':''),'ok');
    });
  }).catch(function(e){
    destrava();
    toast('NÃO foi salvo: '+(e && e.message || e),'err',8000);
  });
}

function svSenhaUsr(n){
  var lista = _usrLista();
  var u = lista[n];
  if (!u) { toast('Usuario nao encontrado','err'); return; }
  var s1 = (document.getElementById('usenha')||{value:''}).value;
  var s2 = (document.getElementById('usenha2')||{value:''}).value;
  if (!s1) { toast('Informe a nova senha','err'); return; }
  if (s1.length < 6) { toast('A senha precisa de no mínimo 6 caracteres','err'); return; }
  if (s1 !== s2) { toast('As senhas não conferem','err'); return; }

  var idAntigo = u.id;
  var trocouId = !_usrIdValido(idAntigo);
  var id = trocouId ? nid(lista) : idAntigo;
  var btn = document.getElementById('uBtnSenha');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  function destrava(){ if (btn) { btn.disabled = false; btn.innerHTML = '&#128190; Salvar senha'; } }

  var p;
  if (!amTemCrypto()) {
    toast('Navegador sem suporte a hash — senha gravada sem proteção','err',7000);
    p = Promise.resolve({ senha: s1, senhaHash: null, salt: null });
  } else {
    var salt = amNovoSalt();
    p = amHashSenha(s1, salt).then(function(h){ return { senhaHash:h, salt:salt, senha:null }; });
  }

  p.then(function(campos){
    var obj = Object.assign({}, u, { id:id }, campos);
    fsave('usuarios', obj, function(err){
      if (err) {
        destrava();
        toast('A senha NÃO foi alterada: '+(err && err.code === 'permission-denied'
          ? 'o banco não autoriza gravar em usuarios.' : (err.message||'falha de conexão')),'err',8000);
        return;
      }
      if (trocouId) fdel('usuarios', String(idAntigo));
      DB.usuarios = lista.map(function(x,i){ return i === n ? obj : x; });
      sDB(); cm(); renderUsr();
      toast('Senha de '+u.nome+' alterada','ok');
    });
  }).catch(function(e){
    destrava();
    toast('A senha NÃO foi alterada: '+(e && e.message || e),'err',8000);
  });
}

function dlUsr(n){
  var lista = _usrLista();
  var u = lista[n];
  if (!u) { toast('Usuario nao encontrado','err'); return; }
  // 🔴 Duas travas que nao podem sair: apagar a propria conta derruba quem
  // esta usando o sistema, e apagar o ultimo admin tranca todos para fora.
  if (_usrEuLogin() && String(u.login||'').toLowerCase() === _usrEuLogin()) {
    toast('Você não pode excluir o usuário com que está logado','err',6000); return;
  }
  if (u.perfil === 'admin' && u.status !== 'inativo' && _usrAdminsAtivos(n) === 0) {
    toast('Este é o único administrador ativo — criar outro antes de excluir','err',7000); return;
  }
  if (!confirm('Excluir o usuário '+u.nome+' (@'+(u.login||'')+')?\n\nEle perde o acesso ao sistema. Isto não pode ser desfeito.')) return;
  fdel('usuarios', String(u.id), function(err){
    if (err) {
      toast('NÃO foi excluído: '+(err.message||'falha de conexão'),'err',8000);
      return;   // a linha continua na tela: o que se ve e o que o banco tem
    }
    DB.usuarios = lista.filter(function(x,i){ return i !== n; });
    sDB(); renderUsr();
    toast('Usuário excluído','ok');
  });
}

// marcar 'Todas' desabilita a escolha item a item -- o curinga nao e a lista
function _pfTodas(classe, marcado){
  document.querySelectorAll('.'+classe).forEach(function(c){
    c.checked = marcado ? true : c.checked;
    c.disabled = !!marcado;
  });
}

function svPerfil(chave){
  var nome = (document.getElementById('pfNome')||{value:''}).value.trim() || chave;
  var todasT = !!(document.getElementById('pfTodasTelas')||{}).checked;
  var todasA = !!(document.getElementById('pfTodasAcoes')||{}).checked;
  var telas = todasT ? [AM_CURINGA] : Array.prototype.map.call(
    document.querySelectorAll('.pf-tela:checked'), function(c){ return c.value; });
  var acoes = {};
  if (todasA) acoes[AM_CURINGA] = true;
  else Array.prototype.forEach.call(document.querySelectorAll('.pf-acao:checked'),
    function(c){ acoes[c.value] = true; });

  // 🔴 O perfil admin nao pode perder as funcoes de gestao: seria o unico
  // caminho de volta. A trava do isAdmin() ja garante o acesso, mas deixar a
  // tela mostrar menos do que a pessoa tem seria mentir sobre o acesso.
  if (chave === 'admin' && !todasA) {
    toast('O perfil Administrador alcança tudo por definição — não é possível limitá-lo','err',7000);
    return;
  }

  var defs = amPerfisDef();
  var obj = {};
  Object.keys(defs).forEach(function(k){
    obj[k] = { nome: defs[k].nome, telas: defs[k].telas, acoes: defs[k].acoes };
  });
  obj[chave] = { nome: nome, telas: telas, acoes: acoes };

  var btn = document.getElementById('pfBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }
  amSalvarPerfis(obj, function(err){
    if (btn) { btn.disabled = false; btn.innerHTML = '&#128190; Salvar perfil'; }
    if (err) {
      toast('NÃO foi salvo: '+(err && err.code === 'permission-denied'
        ? 'o banco não autoriza gravar em config. Fale com o responsável.'
        : (err.message||'falha de conexão')),'err',9000);
      return;   // o modal fica aberto
    }
    DB.perfis = obj;
    sDB(); cm(); renderPerfis();
    toast('Perfil '+nome+' salvo','ok');
  });
}

  '<div class="fg"><label>CEP</label><input id="ecep" value="'+(e.cep||'')+'" oninput="this.value=maskCEP(this.value)"></div></div>' +
  '<div class="fr">' +
  '<div class="fg"><label>Cidade</label><input id="ecidade" value="'+(e.cidade||'')+'"></div>' +
  '<div class="fg"><label>UF</label><input id="euf" value="'+(e.uf||'')+'" maxlength="2" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"></div></div>' +
  '<div class="fr"><div class="fg full"><label>Email</label>' +
  '<input id="eemail" type="email" value="'+(e.email||'')+'"></div></div>' +
  '<div style="margin-top:16px;display:flex;gap:10px">' +
  '<button class="btn bp" onclick="svCfg()">&#128190; Salvar Configuracoes</button>' +
  '</div></div>';
}

function svCfg(){
  var emp = {
    nome:     document.getElementById('enome').value.trim(),
    cnpj:     document.getElementById('ecnpj').value.trim(),
    telefone: document.getElementById('etel').value.trim(),
    endereco: document.getElementById('eend').value.trim(),
    bairro:   document.getElementById('ebairro').value.trim(),
    cep:      document.getElementById('ecep').value.trim(),
    cidade:   document.getElementById('ecidade').value.trim(),
    uf:       document.getElementById('euf').value.toUpperCase(),
    email:    document.getElementById('eemail').value.trim(),
  };
  if(!emp.nome||!emp.cnpj){toast('Informe Razao Social e CNPJ','err');return;}
  DB.empresa = emp;
  sDB();
  fdb.collection('config').doc('empresa').set(emp)
    .then(function(){ toast('Configuracoes salvas com sucesso','ok'); })
    .catch(function(e){ toast('Erro ao salvar: '+e.message,'err'); });
}

function exportRelatorio(){
  var vendidos = DB.veiculos.filter(function(v){return v.status==='vendido';});
  var cols = [
    {label:'Veiculo',fn:function(v){return v.marca+' '+v.modelo+' '+(v.versao||'');}},
    {label:'Placa',key:'placa'},
    {label:'Ano',key:'ano'},
    {label:'Cor',key:'cor'},
    {label:'KM',fn:function(v){return Number(v.km||0).toLocaleString('pt-BR');}},
    {label:'Valor Compra',fn:function(v){return brl(v.valor_compra);}},
    {label:'Valor Venda',fn:function(v){var vd=DB.vendas.find(function(x){return x.veiculo_id==v.id;});return brl(vd?vd.valor:v.preco);}},
    {label:'Cliente',fn:function(v){var vd=DB.vendas.find(function(x){return x.veiculo_id==v.id;});return vd?cNome(vd.cliente_id):'-';}},
    {label:'Data Venda',fn:function(v){var vd=DB.vendas.find(function(x){return x.veiculo_id==v.id;});return vd?fd(vd.data):'-';}},
  ];
  if(confirm('Exportar como PDF?\nCancele para exportar CSV.')) {
    exportPrint('Relatorio de Veiculos Vendidos',cols,vendidos,
      vendidos.length+' veiculos vendidos &bull; Gerado em '+new Date().toLocaleDateString('pt-BR'));
  } else {
    exportCSV(vendidos,'relatorio-vendidos-'+Date.now()+'.csv',cols);
  }
}
