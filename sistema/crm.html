var DB=loadDB();



// ── Variáveis globais CRM ──────────────────────────────────────
var crmSrch = '', crmFonte = '', crmResp = '', crmStatus = '';
var crmMostrarPerdidos = false;

var ETAPAS = [
  { id:'novo',        label:'Novo Lead',   cor:'#3b82f6', icon:'&#9733;' },
  { id:'contato',     label:'Contato',     cor:'#f59e0b', icon:'&#9742;' },
  { id:'negociacao',  label:'Negociação',  cor:'#8b5cf6', icon:'&#9889;' },
  { id:'proposta',    label:'Proposta',    cor:'#e0901c', icon:'&#128196;' },
  { id:'ganho',       label:'Ganho',       cor:'#22c55e', icon:'&#10003;' },
  { id:'perdido',     label:'Perdido',     cor:'#ef4444', icon:'&#10007;' }
];

var FONTES = ['WhatsApp','Instagram','Facebook','OLX','Indicação','Presencial','Site','Outro'];

// ── Utilitários ───────────────────────────────────────────────
function etapa(id){ return ETAPAS.find(function(e){return e.id===id;})||ETAPAS[0]; }
function corEtapa(id){ return etapa(id).cor; }
function labelEtapa(id){ return etapa(id).label; }
function iconFonte(f){
  var m={'WhatsApp':'&#128172;','Instagram':'&#128247;','Facebook':'&#128100;',
         'OLX':'&#128282;','Indicação':'&#128101;','Presencial':'&#127970;',
         'Site':'&#127760;','Outro':'&#128196;'};
  return m[f]||'&#128196;';
}

function diasAte(dt){
  if(!dt) return null;
  var d = new Date(dt+'T12:00'); var hoje = new Date();
  hoje.setHours(0,0,0,0);
  return Math.round((d-hoje)/86400000);
}

function badgeRetorno(dt){
  var d = diasAte(dt);
  if(d===null) return '';
  if(d<0)  return '<span style="background:#fee2e2;color:#dc2626;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700">&#9888; '+Math.abs(d)+'d atraso</span>';
  if(d===0) return '<span style="background:#fef9c3;color:#854d0e;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700">Hoje</span>';
  if(d<=3)  return '<span style="background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700">Em '+d+'d</span>';
  return '<span style="background:#f0fdf4;color:#166534;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700">'+new Date(dt+'T12:00').toLocaleDateString('pt-BR')+'</span>';
}

// ── Filtro de leads ───────────────────────────────────────────
function filtrarLeads(){
  var leads = Array.isArray(DB.leads) ? DB.leads : [];
  var q = crmSrch.toLowerCase();
  return leads.filter(function(l){
    if(!crmMostrarPerdidos && l.status==='perdido') return false;
    if(crmStatus && l.status!==crmStatus) return false;
    if(crmFonte  && l.fonte!==crmFonte)   return false;
    if(crmResp   && l.responsavel!==crmResp) return false;
    if(!q) return true;
    return (l.nome||'').toLowerCase().includes(q)||
           (l.telefone||'').includes(q)||
           (l.veiculo_interesse||'').toLowerCase().includes(q)||
           (l.observacoes||'').toLowerCase().includes(q);
  });
}

// ── Render principal ──────────────────────────────────────────
function render(){
  var leads = filtrarLeads();
  var hoje = new Date(); hoje.setHours(0,0,0,0);

  // Métricas
  var todos   = Array.isArray(DB.leads) ? DB.leads : [];
  var ativos  = todos.filter(function(l){return l.status!=='ganho'&&l.status!=='perdido';});
  var ganhos  = todos.filter(function(l){return l.status==='ganho';});
  var vencidos = ativos.filter(function(l){
    return l.data_retorno && new Date(l.data_retorno+'T12:00')<hoje;
  });
  var totalValor = ganhos.reduce(function(s,l){return s+Number(l.valor_estimado||0);},0);

  // Responsáveis únicos para filtro
  var resps = Array.from(new Set(todos.map(function(l){return l.responsavel;}).filter(Boolean)));
  var fontesSel = FONTES;

  var html = '<div style="padding:20px 24px">';

  // ── Cards de métricas
  html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">';
  html += metricCard('&#9733; Leads Ativos',    ativos.length,   '#3b82f6', 'Este funil');
  html += metricCard('&#9889; Retornos Venc.',  vencidos.length, '#ef4444', 'Pendentes');
  html += metricCard('&#10003; Ganhos',          ganhos.length,   '#22c55e', 'Total');
  html += metricCard('R$ Estimado',             'R$\u00a0'+brl(totalValor),'#e0901c','Ganhos');
  html += '</div>';

  // ── Barra de filtros
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center">';
  html += '<input id="crm-srch" value="'+crmSrch+'" oninput="crmSrch=this.value;render()" placeholder="&#128269; Buscar lead..." style="flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text)">';
  html += '<select onchange="crmFonte=this.value;render()" style="padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text)"><option value="">Todas as fontes</option>'+FONTES.map(function(f){return '<option value="'+f+'"'+(crmFonte===f?' selected':'')+'>'+iconFonte(f)+' '+f+'</option>';}).join('')+'</select>';
  if(resps.length>0) html += '<select onchange="crmResp=this.value;render()" style="padding:8px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text)"><option value="">Todos resp.</option>'+resps.map(function(r){return '<option value="'+r+'"'+(crmResp===r?' selected':'')+'>'+r+'</option>';}).join('')+'</select>';
  html += '<label style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-muted);cursor:pointer;white-space:nowrap"><input type="checkbox" '+(crmMostrarPerdidos?'checked':'')+' onchange="crmMostrarPerdidos=this.checked;render()"> Mostrar perdidos</label>';
  html += '<button class="btn bp bsm" onclick="fmLead(null)" style="white-space:nowrap">&#43; Novo Lead</button>';
  html += '</div>';

  // ── Kanban
  var etapasVisiveis = crmMostrarPerdidos ? ETAPAS : ETAPAS.filter(function(e){return e.id!=='perdido';});
  html += '<div style="display:flex;gap:14px;overflow-x:auto;padding-bottom:16px;align-items:flex-start">';

  etapasVisiveis.forEach(function(et){
    var cols = leads.filter(function(l){return l.status===et.id;});
    html += '<div style="min-width:240px;max-width:280px;flex:0 0 260px">';
    // Cabeçalho da coluna
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:10px 14px;background:'+et.cor+'18;border-radius:8px;border-top:3px solid '+et.cor+'">';
    html += '<span style="font-weight:700;font-size:13px;color:'+et.cor+'">'+et.icon+' '+et.label+'</span>';
    html += '<span style="background:'+et.cor+';color:#fff;border-radius:20px;padding:2px 8px;font-size:12px;font-weight:700">'+cols.length+'</span>';
    html += '</div>';
    // Cards
    cols.forEach(function(l){
      html += cardLead(l);
    });
    // Botão adicionar na coluna
    html += '<button onclick="fmLead(null,\''+et.id+'\')" style="width:100%;margin-top:8px;padding:8px;border:1.5px dashed var(--border);border-radius:8px;background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer">&#43; Adicionar</button>';
    html += '</div>';
  });

  html += '</div>'; // kanban
  html += '</div>'; // padding

  document.getElementById('main').innerHTML = html;
  renderIcons();
}

function metricCard(label, val, cor, sub){
  return '<div style="background:var(--surface);border-radius:12px;padding:18px 20px;border:1px solid var(--border);border-left:4px solid '+cor+'">'+
    '<div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">'+label+'</div>'+
    '<div style="font-size:26px;font-weight:800;color:var(--text);line-height:1">'+val+'</div>'+
    '<div style="font-size:12px;color:var(--text-muted);margin-top:4px">'+sub+'</div>'+
  '</div>';
}

function cardLead(l){
  var et = etapa(l.status);
  var diasR = diasAte(l.data_retorno);
  var atraso = diasR!==null && diasR<0;
  var brd = atraso ? '#ef4444' : 'var(--border)';
  var html = '<div style="background:var(--surface);border-radius:10px;padding:14px;margin-bottom:10px;border:1.5px solid '+brd+';box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer" onclick="fmLead('+l.id+')">';
  // Nome + fonte
  html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px">';
  html += '<span style="font-weight:700;font-size:14px;color:var(--text);line-height:1.3">'+l.nome+'</span>';
  html += '<span style="font-size:16px" title="'+l.fonte+'">'+iconFonte(l.fonte)+'</span>';
  html += '</div>';
  // Telefone
  if(l.telefone) html += '<div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">&#128222; '+l.telefone+'</div>';
  // Veículo interesse
  if(l.veiculo_interesse) html += '<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px">&#128663; '+l.veiculo_interesse+'</div>';
  // Valor
  if(l.valor_estimado) html += '<div style="font-size:13px;font-weight:600;color:#22c55e;margin-bottom:6px">R$\u00a0'+brl(l.valor_estimado)+'</div>';
  // Badge retorno
  if(l.data_retorno) html += '<div style="margin-bottom:6px">'+badgeRetorno(l.data_retorno)+'</div>';
  // Responsável
  if(l.responsavel) html += '<div style="font-size:11px;color:var(--text-muted)">&#128100; '+l.responsavel+'</div>';
  // Ações rápidas
  html += '<div style="display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--border);padding-top:8px" onclick="event.stopPropagation()">';
  // Botões avançar/recuar no funil
  var idx = ETAPAS.findIndex(function(e){return e.id===l.status;});
  if(idx>0 && ETAPAS[idx-1].id!=='ganho')
    html += '<button class="btn bg2 bsm" onclick="moverEtapa('+l.id+','+(idx-1)+')" title="Recuar">&#9664;</button>';
  if(idx<ETAPAS.length-2)
    html += '<button class="btn bp bsm" onclick="moverEtapa('+l.id+','+(idx+1)+')" title="Avançar" style="background:'+ETAPAS[idx+1].cor+'">&#9654;</button>';
  if(l.telefone)
    html += '<a href="https://wa.me/55'+l.telefone.replace(/\D/g,'')+'" target="_blank" class="btn bsm" style="background:#25d366;color:#fff;text-decoration:none">&#128172;</a>';
  html += '<button class="btn bd bsm" onclick="dlLead('+l.id+')" title="Excluir">&#128465;</button>';
  html += '</div>';
  html += '</div>';
  return html;
}

function moverEtapa(id, idx){
  var l = (DB.leads||[]).find(function(x){return x.id==id;});
  if(!l) return;
  var statusAntes = l.status, atualizacaoAntes = l.data_atualizacao;
  l.status = ETAPAS[idx].id;
  l.data_atualizacao = new Date().toISOString().split('T')[0];
  render();   // a tela responde na hora
  fsave('leads', l, function(err){
    if(err){
      l.status = statusAntes;              // desfaz: o quadro nao pode mostrar
      l.data_atualizacao = atualizacaoAntes; // uma etapa que o banco nao tem
      render();
      toast(erroGravacao(err), 'err');
      return;
    }
    sDB();
    toast('Lead movido para '+ETAPAS[idx].label,'ok');
  });
}

// ── Formulário de Lead ────────────────────────────────────────
function fmLead(id, statusInicial){
  var l = id ? (DB.leads||[]).find(function(x){return x.id==id;})||{} : {};
  var status = l.status || statusInicial || 'novo';
  var titulo = id ? 'Editar Lead' : 'Novo Lead';
  var hoje = new Date().toISOString().split('T')[0];

  var optsEtapa = ETAPAS.map(function(e){
    return '<option value="'+e.id+'"'+(status===e.id?' selected':'')+'>'+e.icon+' '+e.label+'</option>';
  }).join('');

  var optsFonte = [''].concat(FONTES).map(function(f){
    return '<option value="'+f+'"'+(((l.fonte||'')===f)?' selected':'')+'>'+f+'</option>';
  }).join('');

  om(
    '<div class="mt2"><span>'+titulo+'</span><button class="btn bg2 bsm" onclick="cm()">&#10005;</button></div>'+
    '<div class="mb" style="padding:16px 20px">'+

    '<div class="fr">'+
    '<div class="fg"><label>Nome *</label><input id="lnome" value="'+(l.nome||'')+'" placeholder="Nome do cliente" autofocus></div>'+
    '<div class="fg"><label>Telefone *</label><input id="ltel" value="'+(l.telefone||'')+'" placeholder="(75) 99999-9999"></div>'+
    '</div>'+

    '<div class="fr">'+
    '<div class="fg"><label>E-mail</label><input id="lemail" value="'+(l.email||'')+'" placeholder="email@exemplo.com"></div>'+
    '<div class="fg"><label>Veículo de Interesse</label><input id="lveic" value="'+(l.veiculo_interesse||'')+'" placeholder="Ex: HB20 2021, Fiorino..."></div>'+
    '</div>'+

    '<div class="fr">'+
    '<div class="fg"><label>Etapa</label><select id="lstatus">'+optsEtapa+'</select></div>'+
    '<div class="fg"><label>Fonte</label><select id="lfonte">'+optsFonte+'</select></div>'+
    '</div>'+

    '<div class="fr">'+
    '<div class="fg"><label>Valor Estimado (R$)</label><input id="lvalor" type="number" step="0.01" value="'+(l.valor_estimado||'')+'" placeholder="0,00"></div>'+
    '<div class="fg"><label>Próximo Retorno</label><input id="lretorno" type="date" value="'+(l.data_retorno||'')+'"></div>'+
    '</div>'+

    '<div class="fr">'+
    '<div class="fg"><label>Responsável</label><input id="lresp" value="'+(l.responsavel||getSession()&&getSession().nome||'')+'" placeholder="Nome do vendedor"></div>'+
    '</div>'+

    '<div class="fr"><div class="fg full"><label>Observações</label>'+
    '<textarea id="lobs" rows="3">'+(l.observacoes||'')+'</textarea></div></div>'+
    '</div>'+

    '<div class="mf">'+
    '<button class="btn bg2" onclick="cm()">Cancelar</button>'+
    (id?'<button class="btn bd" onclick="dlLead('+id+')" style="margin-right:auto">&#128465; Excluir</button>':'')+
    '<button class="btn bp" id="lead-salvar" onclick="svLead('+(id||'null')+')">&#10004; Salvar</button>'+
    '</div>',
    true
  );
}

// Traduz a falha de gravacao para algo que a pessoa entenda.
function erroGravacao(err){
  var txt = String((err && (err.code || err.message)) || '').toLowerCase();
  if(txt.indexOf('permission') >= 0 || txt.indexOf('insufficient') >= 0)
    return 'NAO foi salvo: o banco nao autoriza gravar em leads. Fale com o responsavel.';
  if(txt.indexOf('unavailable') >= 0 || txt.indexOf('network') >= 0)
    return 'NAO foi salvo: sem conexao com o banco. Tente de novo.';
  return 'NAO foi salvo: ' + ((err && err.message) ? err.message : 'erro ao gravar');
}

function svLead(id){
  var nome = (document.getElementById('lnome')||{value:''}).value.trim();
  var tel  = (document.getElementById('ltel')||{value:''}).value.trim();
  if(!nome||!tel){toast('Nome e Telefone sao obrigatorios','err');return;}

  var anterior = (DB.leads||[]).find(function(x){return x.id==id;}) || {};
  var hoje = new Date().toISOString().split('T')[0];
  var obj={
    id: id||nid(DB.leads||[]),
    nome: nome,
    telefone: tel,
    email: (document.getElementById('lemail')||{value:''}).value.trim(),
    veiculo_interesse: (document.getElementById('lveic')||{value:''}).value.trim(),
    status: (document.getElementById('lstatus')||{value:'novo'}).value,
    fonte:  (document.getElementById('lfonte')||{value:''}).value,
    valor_estimado: Number((document.getElementById('lvalor')||{value:0}).value)||0,
    data_retorno: (document.getElementById('lretorno')||{value:''}).value,
    responsavel: (document.getElementById('lresp')||{value:''}).value.trim(),
    observacoes: (document.getElementById('lobs')||{value:''}).value.trim(),
    data_cadastro: id ? (anterior.data_cadastro || hoje) : hoje,
    data_atualizacao: hoje
  };

  // A ORDEM AQUI E O CONSERTO. Antes o lead entrava na lista e no cache na
  // hora e o aviso verde aparecia sempre, mesmo com a gravacao falhando --
  // ficava na tela parecendo salvo o que nunca chegou ao banco. Agora nada
  // muda enquanto o banco nao confirmar, e o modal fica aberto se der errado,
  // para nao se perder o que foi digitado.
  var btn = document.getElementById('lead-salvar');
  if(btn){ btn.disabled = true; btn.innerHTML = 'Salvando...'; }

  fsave('leads', obj, function(err){
    if(btn){ btn.disabled = false; btn.innerHTML = '&#10004; Salvar'; }
    if(err){ toast(erroGravacao(err), 'err'); return; }
    if(!DB.leads) DB.leads=[];
    if(id) DB.leads=DB.leads.map(function(x){return x.id==id?obj:x;});
    else DB.leads.push(obj);
    sDB(); cm(); render();
    toast(id?'Lead atualizado':'Lead cadastrado!','ok');
  });
}

function dlLead(id){
  if(!confirm('Excluir este lead?')) return;
  fdel('leads', id, function(err){
    if(err){ toast(erroGravacao(err), 'err'); return; }  // segue na tela, como no banco
    DB.leads=(DB.leads||[]).filter(function(x){return x.id!=id;});
    sDB(); cm(); render();
    toast('Lead excluido','ok');
  });
}

// ── Funções utilitárias copiadas do padrão do sistema ─────────
function om(h,lg){
  var md=document.getElementById('mdc');
  if(!md){return;}
  md.className='md'+(lg?' md-lg':'');
  md.innerHTML=h;
  var mo=document.getElementById('modal');
  if(!mo){return;}
  mo.style.display='flex';
  mo.onclick=function(e){if(e.target===mo)cm();};
}
function cm(){
  var mo=document.getElementById('modal');
  if(mo) mo.style.display='none';
}


// ── sbCollapse ────────────────────────────────────────────────
function sbCollapse(){
  var sb=document.getElementById('sb');
  var ml=document.querySelector('.layout-main');
  if(!sb) return;
  var col=sb.classList.toggle('sb-collapsed');
  localStorage.setItem('sb_col',col?'1':'0');
  if(ml) ml.style.marginLeft=col?'var(--sidebar-collapsed-w)':'var(--sidebar-w)';
  var btn=document.getElementById('sb-toggle-btn');
  if(btn) btn.innerHTML=col?'&#9656;':'&#9666;';
}
function tsb(){document.getElementById('sb').classList.toggle('open');document.getElementById('sb-overlay').classList.toggle('sh');}
function csb(){document.getElementById('sb').classList.remove('open');document.getElementById('sb-overlay').classList.remove('sh');}

// -- Lucide init + reinit helper -------------------------------
function renderIcons(){
  if(typeof lucide !== 'undefined'){
    try { lucide.createIcons(); } catch(e){}
  }
}

// -- Theme toggle ----------------------------------------------
function toggleTheme(){
  var current = document.documentElement.getAttribute('data-theme') || 'light';
  var next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('am_theme', next);
  updateThemeBtn(next);
}
function updateThemeBtn(theme){
  var icon  = document.getElementById('theme-icon');
  var label = document.getElementById('theme-label');
  if(icon)  icon.setAttribute('data-lucide', theme === 'dark' ? 'moon' : 'sun');
  if(label) label.textContent = theme === 'dark' ? 'Tema Escuro' : 'Aparência';
  renderIcons();
}
(function(){
  var saved = localStorage.getItem('am_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.addEventListener('DOMContentLoaded', function(){ updateThemeBtn(saved); });
})();

// ── Init ──────────────────────────────────────────────────────
checkAuth(function(){
  applyProfile();
  if(DB && DB.veiculos && DB.veiculos.length>0){ render(); }
  else { showLoading('Carregando CRM...'); }
  loadFromFirestore().then(function(){ render(); })
    .catch(function(e){ console.error('[CRM]',e); });
});

// Restaurar sidebar
(function(){
  if(localStorage.getItem('sb_col')==='1'){
    var sb=document.getElementById('sb');
    var ml=document.querySelector('.layout-main');
    var btn=document.getElementById('sb-toggle-btn');
    if(sb) sb.classList.add('sb-collapsed');
    if(ml) ml.style.marginLeft='var(--sidebar-collapsed-w)';
    if(btn) btn.innerHTML='&#9656;';
  }
})();
</script>
</body></html>
